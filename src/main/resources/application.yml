server:
  port: 8080

spring:
  application:
    name: generic-mssql-sp-exec-service

persistence:
  datasource:
    r2dbc-url: "${PERSISTENCE_R2DBC_URL}"
    username: "${PERSISTENCE_USER}"
    password: "${PERSISTENCE_PASS}"
    pool:
      initial-size: ${DB_POOL_INITIAL_SIZE}
      max-size: ${DB_POOL_MAX_SIZE}
      max-idle-time: ${DB_POOL_MAX_IDLE_TIME}
      max-acquire-time: ${DB_POOL_MAX_ACQUIRE_TIME}

app:
  stored-procedures:
    default-schema: ${DB_SCHEMA}
    timeout: ${SP_TIMEOUT}
    max-rows: ${SP_MAX_ROWS}
    allowed: []

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.r2dbc.mssql: ${R2DBC_LOG_LEVEL}
    io.r2dbc.pool: ${R2DBC_POOL_LOG_LEVEL}
